<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网络安全学习目录 | Charles Wesley</title>
  <style>
    body {
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: #f4f6fa;
      margin: 0;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #111, #1a1a1a);
      color: white;
      padding: 50px 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    header h1 {
      font-size: 2.2em;
      margin-bottom: 0.5em;
    }

    header p {
      color: #ccc;
      font-size: 1.1em;
    }

    .search-box {
      display: flex;
      justify-content: center;
      margin: 40px 0 20px;
    }

    .search-box input {
      width: 80%;
      max-width: 500px;
      padding: 12px 16px;
      font-size: 1em;
      border: 2px solid #00ffaa;
      border-radius: 10px;
      outline: none;
      transition: box-shadow 0.3s;
    }

    .search-box input:focus {
      box-shadow: 0 0 10px #00ffaa;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      padding: 30px 20px 60px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    .card h3 {
      color: #0078d7;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .card p {
      color: #555;
      line-height: 1.6;
    }

    .tags {
      margin: 10px 0;
    }

    .tag {
      display: inline-block;
      background-color: #e3f8f2;
      color: #00786b;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.9em;
      margin-right: 6px;
    }

    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 8px 14px;
      background-color: #00ffaa;
      color: #111;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #00e699;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header>
    <h1>网络安全目录</h1>
    <p>快速浏览 html  linux tcp/ip 等模块，探索如何成为网络安全高手</p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 搜索模块或关键字…" />
  </div>

  <div class="container" id="cardContainer">
    <!-- Python -->
    <div class="card" data-keywords="html CSS javascript 网页的构成">
      <h3>🐍 html CSS javascript</h3>
      <p>学习网页的构成与如何创建一个简单的网页</p>
      <div class="tags">
        <span class="tag">网站</span>
        <span class="tag">构建</span>
      </div>
      <a href="h.html" class="btn">进入</a>
    </div>

  

  <footer>
    © 2025 Charles Wesley — Knowledge in Motion
  </footer>

  <script>
    // 简易搜索过滤功能
    const input = document.getElementById("searchInput");
    const cards = document.querySelectorAll(".card");

    input.addEventListener("input", () => {
      const query = input.value.trim().toLowerCase();
      cards.forEach(card => {
        const keywords = card.dataset.keywords.toLowerCase();
        card.style.display = keywords.includes(query) ? "block" : "none";
      });
    });
  </script>
</body>
</html>
