<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Java 基础 | Charles Wesley</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background: linear-gradient(180deg, #0d1117, #1b1f24);
      color: #ddd;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.8;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      padding: 60px 20px 30px;
      color: #00ffaa;
      background: #0f1115;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    }

    pre {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
    }

    code {
      color: #00ffaa;
    }

    a {
      color: #00ffaa;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 40px;
      color: #00ffaa;
      text-decoration: none;
    }

    .back:hover {
      color: #00e699;
    }
  </style>
</head>
<body>

  <header>
    <h1>☕ Java 基础</h1>
    <p>自动加载自 GitHub 仓库的 Markdown 内容</p>
  </header>

  <main id="content">
    <p>加载中，请稍候...</p>
  </main>

  <a href="java.html" class="back">⬅ 返回 Java 模块</a>

  <script>
    // 你的 Markdown 原始链接（必须是 raw.githubusercontent.com 形式）
    const mdUrl = "https://raw.githubusercontent.com/CharlesWesley-S/computer-science-notes/main/中文/基础编程/java_基本知识.md";

    fetch(mdUrl)
      .then(res => {
        if (!res.ok) throw new Error("获取 Markdown 失败");
        return res.text();
      })
      .then(text => {
        document.getElementById("content").innerHTML = marked.parse(text);
      })
      .catch(err => {
        document.getElementById("content").innerHTML =
          `<p style="color:#f88;">❌ 加载失败：${err.message}</p>`;
      });
  </script>

</body>
</html>
