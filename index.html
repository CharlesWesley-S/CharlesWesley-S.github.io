<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charles Wesley's Site</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #f8f9fa;
      color: #222;
    }

    /* 顶部导航栏 */
    nav {
      background-color: #111;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 16px 20px;
      display: block;
      transition: background-color 0.3s;
    }

    nav a:hover {
      background-color: #333;
    }

    /* 下拉菜单容器 */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    /* 下拉菜单按钮 */
    .dropbtn {
      cursor: pointer;
    }

    /* 下拉内容 */
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #222;
      min-width: 220px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
      border-radius: 6px;
      top: 55px;
      left: 0;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.25s ease;
      z-index: 10;
    }

    /* 下拉内容的链接 */
    .dropdown-content a {
      color: #eee;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
    }

    .dropdown-content a:hover {
      background-color: #444;
    }

    /* 悬停展开 */
    .dropdown:hover .dropdown-content {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    /* 顶部文字样式 */
    header {
      text-align: center;
      padding: 100px 20px;
    }

    header h1 {
      font-size: 2.5em;
      margin-bottom: 0.4em;
    }

    header p {
      color: #555;
      font-size: 1.2em;
    }

  </style>
</head>
<body>

  <!-- 顶部导航栏 -->
  <nav>
    <a href="index.html">Home</a>

    <div class="dropdown">
      <a class="dropbtn">Projects ▾</a>
      <div class="dropdown-content">
        <a href="posts/cs-notes.html">💻 Computer Science Notes</a>
        <a href="posts/ctf-notes.html">🧩 CTF Notes</a>
        <a href="posts/noteflow.html">🗂️ NoteFlow System</a>
        <a href="posts/quantum.html">⚛️ Quantum Computing</a>
      </div>
    </div>

    <div class="dropdown">
      <a class="dropbtn">Writings ▾</a>
      <div class="dropdown-content">
        <a href="#">📘 江湖行</a>
        <a href="#">🧠 哲学笔记</a>
        <a href="#">✍️ 文学随笔</a>
      </div>
    </div>

    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <!-- 主页标题区 -->
  <header>
    <h1>Welcome to Charles Wesley's Site</h1>
    <p>Explore my projects, notes, and writings here.</p>
  </header>

</body>
</html>
